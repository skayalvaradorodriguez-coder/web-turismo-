<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>Observatorio Turístico Sostenible</title>

  <!-- Aplica el tema (claro/oscuro) antes de pintar, para evitar un parpadeo -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ots-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'dark') document.documentElement.classList.add('ion-palette-dark');
      } catch (e) { }
    })();
  </script>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <app-root></app-root>
</body>

</html>

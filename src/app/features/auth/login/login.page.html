<ion-content class="ion-padding">
  <main class="login-temporal">
    <h1>Iniciar sesión</h1>
    <p class="aviso">Pantalla temporal para probar la conexión con la API. El diseño final llega en la Etapa 6.</p>

    <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" formControlName="email" autocomplete="username" inputmode="email" />
      @if (mostrarError('email')) {
        <small class="error">Ingresa un correo válido</small>
      }

      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      @if (mostrarError('password')) {
        <small class="error">Ingresa tu contraseña</small>
      }

      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }

      <button type="submit" [disabled]="cargando()">{{ cargando() ? 'Ingresando…' : 'Ingresar' }}</button>
    </form>
  </main>
</ion-content>

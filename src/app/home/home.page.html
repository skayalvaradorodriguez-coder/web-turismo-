<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Web Turismo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (usuario(); as u) {
  <h2>Hola, {{ u.nombres }}</h2>
  <p>{{ u.email }} · Rol: {{ u.rol }}</p>
  <p>Página temporal protegida: solo se ve con la sesión iniciada.</p>
  <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
  }
</ion-content>

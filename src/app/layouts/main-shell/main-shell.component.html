<div class="shell" [class.shell--abierto]="menuAbierto()">
  <aside id="menu-principal" class="menu" aria-label="Menú principal">
    <div class="menu__arriba">
      <div class="menu__marca">
        <span class="eyebrow"><span class="eyebrow__linea"></span>Santa Elena</span>
        <img
          class="menu__logo"
          src="assets/brand/ots-logo.png"
          alt="Observatorio Turístico Sostenible · UPSE"
        />
        <span class="menu__sub">Plataforma de datos</span>
      </div>

      <nav class="menu__nav" aria-label="Principal">
        @for (item of menu(); track item.ruta) {
          <a
            class="menu__enlace"
            [routerLink]="item.ruta"
            routerLinkActive="menu__enlace--activo"
            (click)="alNavegar()"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path [attr.d]="item.icono" />
            </svg>
            {{ item.etiqueta }}
          </a>
        }
      </nav>
    </div>

    <div class="menu__usuario">
      <span class="menu__avatar" aria-hidden="true">{{ iniciales() }}</span>
      <div class="menu__datos">
        <span class="menu__nombre">{{ usuario()?.nombres }} {{ usuario()?.apellidos }}</span>
        <span class="menu__rol">{{ rolEtiqueta() }}</span>
      </div>
      <button type="button" class="menu__salir" aria-label="Cerrar sesión" (click)="cerrarSesion()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 4H5a1 1 0 00-1 1v14a1 1 0 001 1h4" /><path d="M16 8l4 4-4 4M20 12H9" />
        </svg>
      </button>
    </div>
  </aside>

  <button type="button" class="shell__fondo" aria-label="Cerrar el menú" tabindex="-1" (click)="menuAbierto.set(false)"></button>

  <div class="principal">
    <header class="barra">
      <div class="barra__izq">
        <button
          type="button"
          class="barra__boton"
          aria-label="Mostrar u ocultar el menú"
          aria-controls="menu-principal"
          [attr.aria-expanded]="menuAbierto()"
          (click)="alternarMenu()"
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
        <span class="barra__titulo">Portal institucional</span>
      </div>

      <button
        type="button"
        class="barra__boton barra__boton--redondo"
        (click)="tema.alternar()"
        [attr.aria-label]="tema.esOscuro() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        [attr.aria-pressed]="tema.esOscuro()"
      >
        @if (tema.esOscuro()) {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        } @else {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z" />
          </svg>
        }
      </button>
    </header>

    <main id="contenido" class="principal__contenido">
      <router-outlet />
    </main>
  </div>
</div>
